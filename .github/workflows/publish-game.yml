name: Publish game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write

concurrency:
  group: game-pages-build
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the latest game on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
